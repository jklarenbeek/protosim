name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags e.g., v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install build dependencies (C)
      run: sudo apt-get update && sudo apt-get install -y gcc make libelf-dev

    - name: Setup and Build protosim
      run: |
        npm install
        npm run setup
        npm run build

    - name: Build MCP server
      run: |
        cd mcp-server
        npm install
        npx esbuild src/index.ts --bundle --platform=node --format=esm --external:child_process --external:util --external:fs --external:path --external:url --outfile=dist/index.js

    - name: Set Version
      id: set_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Package with nFPM
      run: |
        echo "Installing nFPM..."
        curl -sfL https://github.com/goreleaser/nfpm/releases/download/v2.35.3/nfpm_2.35.3_Linux_x86_64.tar.gz | tar -xz -C /tmp
        sudo mv /tmp/nfpm /usr/local/bin/
        
        echo "Packaging..."
        nfpm package --packager deb --target ./protosim_${{ env.VERSION }}_amd64.deb
        nfpm package --packager rpm --target ./protosim-${{ env.VERSION }}.x86_64.rpm
        nfpm package --packager archlinux --target ./protosim-${{ env.VERSION }}-x86_64.pkg.tar.zst

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./protosim_${{ env.VERSION }}_amd64.deb
          ./protosim-${{ env.VERSION }}.x86_64.rpm
          ./protosim-${{ env.VERSION }}-x86_64.pkg.tar.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
